<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HabitQuest — Legal</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0F0F1A;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: linear-gradient(90deg, #8B5CF6, #C084FC);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.45);
  }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; }
  p.tag { color: #9CA3AF; font-size: 14px; margin: 0 0 32px; }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link {
    display: block;
    padding: 14px 18px;
    border-radius: 16px;
    background: #1A1A2E;
    border: 1px solid rgba(255,255,255,0.12);
    color: #FFFFFF;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  a.link:hover { border-color: #C084FC; }
  footer { margin-top: 32px; color: #9CA3AF; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">⚔️</div>
    <h1>HabitQuest</h1>
    <p class="tag">Turn your habits into an adventure</p>
    <div class="links">
      <a class="link" href="privacy-policy.html">Privacy Policy</a>
      <a class="link" href="terms.html">Terms of Service</a>
    </div>
    <footer>Contact: habitquest63@gmail.com</footer>
  </div>
</body>
</html>
